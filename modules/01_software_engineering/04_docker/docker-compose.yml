version: '3'

services:
  ml-api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - MODEL_PATH=model.pkl
      - FLASK_ENV=production
    volumes:
      - ./model.pkl:/app/model.pkl
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

